<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student web coding project: Profile Designer">
  <title>Profile Designer</title>
  <link rel="stylesheet" href="style.css">

<body>
<header class="shell"><nav class="nav"><span class="brand">MY SPACE</span><div class="links"><a href="#card">Profile</a><a href="#about">About</a></div></nav></header><main class="shell"><section class="hero"><p class="eyebrow">SECTION 1 • PERSONALIZATION</p><h1>Build a profile that feels like you.</h1><p>Change the name, biography, interests, photograph, and colors.</p></section><section id="card" class="panel profile"><img id="profilePhoto" src="images/profile-placeholder.svg" alt="Student profile photograph"><div><span class="pill">Grade 7 • California</span><h2 id="studentName">Alex Student</h2><p id="about">I enjoy science, drawing, soccer, and learning how websites work.</p><div class="row"><button class="btn" id="themeButton">Change theme</button><button class="btn alt" id="helloButton">Say hello</button></div><p id="message" aria-live="polite"></p></div></section></main>
<footer class="shell"><img class="footer-avatar" src="images/profile-placeholder.svg" alt="Student profile placeholder">Built with HTML, CSS, and JavaScript • <span id="year"></span></footer>
<script src="script.js"></script>
</body>
